services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: soma
      POSTGRES_USER: soma
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soma -d soma"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  web:
    build: .
    command: >-
      sh -c "python manage.py migrate --noinput &&
      exec gunicorn --bind 0.0.0.0:8000 soma_config.wsgi:application"
    environment:
      SECRET_KEY: local-compose-only-000000000000000000000000000000000000
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://soma:local-development-only@db:5432/soma
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data: