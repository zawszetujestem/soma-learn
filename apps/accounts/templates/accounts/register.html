{% extends "base.html" %}

{% block title %}Rejestracja — SOMA{% endblock %}

{% block content %}
    <div class="card" style="max-width: 480px; margin: 0 auto;">
        <h1>Utwórz konto</h1>

        <p class="muted">Załóż konto, aby rozpocząć naukę z mentorem.</p>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Zarejestruj</button>
        </form>

        <p>Masz już konto? <a href="{% url 'accounts:login' %}">Zaloguj się</a>.</p>
    </div>
{% endblock %}
