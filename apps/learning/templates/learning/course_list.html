{% extends "base.html" %}

{% block title %}Kursy — SOMA{% endblock %}

{% block content %}
    <h1>Kursy</h1>
    <ul>
        {% for course in courses %}
            <li><a href="{% url 'learning:course-entry' course.pk %}">{{ course.title }}</a></li>
        {% empty %}
            <li>Brak dostępnych kursów.</li>
        {% endfor %}
    </ul>
{% endblock %}
