<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SOMA{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'learning:course-list' %}">Kursy</a>
                <a href="{% url 'accounts:delete-account' %}">Usuń konto</a>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit">Wyloguj się</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}">Zaloguj się</a>
                <a href="{% url 'accounts:register' %}">Zarejestruj się</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
